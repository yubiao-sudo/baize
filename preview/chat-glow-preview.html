  /* —— 流光边框（与 index.css 中 .chat-glow 同源实现） —— */
  @property --glow-angle { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  .chat-glow { position:absolute; inset:0; z-index:30; border-radius:inherit; pointer-events:none; opacity:1; }
  .chat-glow.fade { animation: glow-dim .7s ease forwards; }
  .chat-glow::before { content:""; position:absolute; inset:0; border-radius:inherit; padding:2px;
    background: conic-gradient(from var(--glow-angle),
      transparent 0deg, transparent 290deg,
      rgba(56,189,248,.85) 325deg, rgba(167,139,250,.95) 348deg, rgba(125,211,252,.9) 360deg);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    animation: glow-spin 1.5s linear infinite; }
  .chat-glow::after { content:""; position:absolute; inset:-1px; border-radius:inherit;
    box-shadow: 0 0 22px rgba(56,189,248,.22), inset 0 0 14px rgba(56,189,248,.07);
    animation: glow-breathe 1.5s ease-in-out infinite; }
  @keyframes glow-spin { to { --glow-angle: 360deg; } }
  @keyframes glow-dim { from { opacity:1; } to { opacity:0; } }
  @keyframes glow-breathe { 0%,100% { opacity:.55; } 50% { opacity:1; } }
  .note { width:100%; text-align:center; color:#64748b; font-size:12px; }
