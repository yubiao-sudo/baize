<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>白泽 · 消息发送涟漪预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: radial-gradient(1200px 700px at 30% 20%, #101a2e 0%, #070b16 55%, #05070d 100%);
    font-family: "Microsoft YaHei", system-ui, sans-serif;
    color: #cbd5e1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 28px 20px 40px;
  }
  h1 { font-size: 16px; font-weight: 600; color: #e2e8f0; }
  p.tip { font-size: 12px; color: #64748b; }
  .btnrow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button.replay {
    padding: 7px 20px;
    border-radius: 999px;
    border: 1px solid rgba(34, 211, 238, 0.45);
    background: rgba(34, 211, 238, 0.12);
    color: #a5f3fc;
    font-size: 13px;
    cursor: pointer;
  }
  button.replay:hover { background: rgba(34, 211, 238, 0.22); }

  /* 模拟输入卡片 */
  .chat-input {
    position: relative;
    width: 560px;
    max-width: 92vw;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 12px 14px;
    background: rgba(28, 38, 60, 0.45);
    border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 16px;
    backdrop-filter: blur(14px);
  }
  .chat-input textarea {
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: #e2e8f0;
    font: inherit;
    font-size: 13.5px;
    padding: 2px 4px;
  }
  .chat-input textarea::placeholder { color: #64748b; }
  .chat-input-footer { display: flex; justify-content: space-between; align-items: center; }
  .hint { font-size: 11px; color: #475569; }
  .send-btn {
    padding: 6px 18px;
    border-radius: 10px;
    border: 1px solid rgba(34, 211, 238, 0.5);
    background: rgba(34, 211, 238, 0.16);
    color: #a5f3fc;
    font-size: 13px;
    cursor: pointer;
  }

  /* ============ 发送涟漪（与 baize/src/index.css 同步） ============ */
  .send-ripple {
    --g1: rgba(56, 189, 248, 0.85);
    --g2: rgba(167, 139, 250, 0.95);
    --g3: rgba(125, 211, 252, 0.9);
    position: absolute;
    inset: 0;
    z-index: 5;
    border-radius: inherit;
    pointer-events: none;
    animation: send-flash 0.7s ease-out forwards;
  }
  .send-ripple::before,
  .send-ripple::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 130%;
    height: 300%;
    border-radius: 50%;
    border: 1.5px solid var(--g2);
    box-shadow: 0 0 14px var(--g1), inset 0 0 10px var(--g1);
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.55);
    animation: send-ripple-run 0.95s cubic-bezier(0.2, 0.5, 0.3, 1) forwards;
  }
  .send-ripple::after {
    border-color: var(--g3);
    animation-delay: 0.16s;
  }
  @keyframes send-ripple-run {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.55); }
    18% { opacity: 0.9; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.9); }
  }
  @keyframes send-flash {
    0% { box-shadow: 0 0 0 1px var(--g2), 0 0 18px var(--g1); }
    100% { box-shadow: 0 0 0 1px rgba(0,0,0,0), 0 0 0 rgba(0,0,0,0); }
  }
  .send-ripple.g-sunset { --g1: rgba(251,146,60,.9); --g2: rgba(244,114,182,.95); --g3: rgba(251,191,36,.9); }
  .send-ripple.g-emerald { --g1: rgba(52,211,153,.9); --g2: rgba(34,211,238,.95); --g3: rgba(167,243,208,.9); }
  .send-ripple.g-neon { --g1: rgba(34,211,238,.9); --g2: rgba(167,139,250,.95); --g3: rgba(248,113,113,.85); }
  .send-ripple.g-moon { --g1: rgba(226,232,240,.7); --g2: rgba(241,245,249,.92); --g3: rgba(203,213,225,.65); }
</style>
</head>
<body>
  <h1>消息发送涟漪 · 输入框流光光环</h1>
  <p class="tip">按下发送的瞬间：卡片边框闪一圈微光 + 双层椭圆光环从中心扩散淡出（约 1s），配色跟随设置页流光样式</p>
  <div class="btnrow">
    <button class="replay" onclick="fire('aurora')">极光青紫</button>
    <button class="replay" onclick="fire('sunset')">落日橙粉</button>
    <button class="replay" onclick="fire('emerald')">翠影青碧</button>
    <button class="replay" onclick="fire('neon')">霓虹彩虹</button>
    <button class="replay" onclick="fire('moon')">月白流银</button>
  </div>
  <div class="chat-input" id="card">
    <textarea rows="2" placeholder="输入消息…"></textarea>
    <div class="chat-input-footer">
      <span class="hint">在白泽里按 Enter 或点发送按钮即触发</span>
      <button class="send-btn" onclick="fire(null)">发 送</button>
    </div>
  </div>
  <script>
    function fire(style) {
      const card = document.getElementById("card");
      const old = card.querySelector(".send-ripple");
      if (old) old.remove();
      const r = document.createElement("div");
      r.className = "send-ripple" + (style && style !== "aurora" ? " g-" + style : "");
      card.appendChild(r);
      window.setTimeout(() => r.remove(), 1200);
    }
  </script>
</body>
</html>
