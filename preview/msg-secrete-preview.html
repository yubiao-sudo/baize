<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>白泽 · 消息分泌出场预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: radial-gradient(1200px 700px at 30% 20%, #101a2e 0%, #070b16 55%, #05070d 100%);
    font-family: "Microsoft YaHei", system-ui, sans-serif;
    color: #cbd5e1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 28px 20px 40px;
  }
  h1 { font-size: 16px; font-weight: 600; color: #e2e8f0; }
  p.tip { font-size: 12px; color: #64748b; text-align: center; }
  button.replay {
    padding: 7px 22px;
    border-radius: 999px;
    border: 1px solid rgba(34, 211, 238, 0.45);
    background: rgba(34, 211, 238, 0.12);
    color: #a5f3fc;
    font-size: 13px;
    cursor: pointer;
  }
  button.replay:hover { background: rgba(34, 211, 238, 0.22); }

  /* 模拟对话流底部 + 输入框 */
  .chat-flow {
    width: 620px;
    max-width: 94vw;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
  }
  .msg.assistant {
    max-width: 82%;
    padding: 10px 14px;
    font-size: 13px;
    background: rgba(148, 163, 184, 0.1);
    border: 1px solid rgba(148, 163, 184, 0.16);
    border-radius: 12px 12px 12px 4px;
  }
  .msg.user {
    align-self: flex-end;
    max-width: 82%;
    padding: 10px 14px;
    font-size: 13px;
    background: #e5e7eb;
    color: #1f2937;
    border-radius: 12px;
    border-bottom-right-radius: 4px;
    text-align: left;
  }
  .msg.user.secrete {
    animation: msg-secrete 0.72s cubic-bezier(0.3, 1.25, 0.45, 1) both;
    transform-origin: 50% 100%;
    will-change: transform, opacity, border-radius;
  }
  @keyframes msg-secrete {
    0% {
      opacity: 0;
      transform: translateY(30px) scale(0.5, 0.16);
      border-radius: 999px;
      filter: blur(1.5px);
    }
    38% {
      opacity: 1;
      transform: translateY(10px) scale(0.9, 1.28);
      border-radius: 999px;
      filter: blur(0.5px);
    }
    62% {
      transform: translateY(-3px) scale(1.08, 0.86);
      border-radius: 16px 16px 16px 6px;
      filter: blur(0);
    }
    82% {
      transform: translateY(1px) scale(0.97, 1.05);
    }
    100% {
      opacity: 1;
      transform: none;
      border-radius: 12px 12px 4px 12px;
      filter: blur(0);
    }
  }
  .chat-input {
    margin-top: 14px;
    width: 620px;
    max-width: 94vw;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: rgba(28, 38, 60, 0.45);
    border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 16px;
    backdrop-filter: blur(14px);
  }
  .chat-input span { flex: 1; font-size: 13px; color: #64748b; }
  .send-btn {
    padding: 6px 18px;
    border-radius: 10px;
    border: 1px solid rgba(34, 211, 238, 0.5);
    background: rgba(34, 211, 238, 0.16);
    color: #a5f3fc;
    font-size: 13px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>消息分泌出场 · 从输入框被「挤」出来</h1>
  <p class="tip">小囊泡在输入框顶边诞生 → 被挤出拉长 → 脱离母体 → 果冻式回弹落位成气泡（约 0.7s）<br/>只作用于刚发送的那一条消息</p>
  <button class="replay" onclick="secrete()">重播分泌动画</button>
  <div class="chat-flow" id="flow">
    <div class="msg assistant">你好，我是白泽。有什么可以帮你的？</div>
  </div>
  <div class="chat-input">
    <span>输入消息…</span>
    <button class="send-btn" onclick="secrete()">发 送</button>
  </div>
  <script>
    const SAMPLES = [
      "帮我看看这个报错是什么意思",
      "把昨天的会议纪要整理成文档",
      "搜一下最近的天气情况",
    ];
    let n = 0;
    function secrete() {
      const flow = document.getElementById("flow");
      const b = document.createElement("div");
      b.className = "msg user secrete";
      b.textContent = SAMPLES[n++ % SAMPLES.length];
      flow.appendChild(b);
      window.setTimeout(() => b.classList.remove("secrete"), 800);
      flow.scrollTop = flow.scrollHeight;
    }
    window.setTimeout(secrete, 400);
  </script>
</body>
</html>
