<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>白泽 BaiZe</title>
    <script>
      /* 主题早加载：首帧渲染前恢复上次选择的主题，避免闪烁 */
      try {
        var t = localStorage.getItem("baize-theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      /* ============ 启动动画：大水球自我介绍 → 飞入主页右侧面板交接 ============ */
      html, body { margin: 0; height: 100%; background: #0b0d12; }
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 26px;
        background:
          radial-gradient(900px 620px at 50% 32%, rgba(37, 99, 235, 0.26) 0%, rgba(37, 99, 235, 0) 62%),
          radial-gradient(720px 480px at 50% 78%, rgba(34, 211, 238, 0.14) 0%, rgba(34, 211, 238, 0) 60%),
          #0b0d12;
        color: #e5e7eb;
        font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        opacity: 1;
        overflow: hidden;
      }
      /* 网格底纹：科幻底色 */
      #splash .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(129, 140, 248, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(129, 140, 248, 0.06) 1px, transparent 1px);
        background-size: 44px 44px;
        -webkit-mask-image: radial-gradient(760px 560px at 50% 42%, #000 0%, transparent 74%);
        mask-image: radial-gradient(760px 560px at 50% 42%, #000 0%, transparent 74%);
        pointer-events: none;
      }
      /* ============ 大水球 ============ */
      #splash .orb-wrap {
        position: relative;
        width: 200px; height: 200px;
        will-change: transform;
        z-index: 2;
      }
      /* 说话式发光晕圈：双层不同节奏叠加，营造「像在说话」的不规则呼吸感 */
      #splash .halo, #splash .halo2 {
        position: absolute; inset: -18px; border-radius: 50%;
        background: radial-gradient(circle, rgba(34, 211, 238, 0.45) 0%, rgba(59, 130, 246, 0.16) 45%, transparent 70%);
        animation: speak-pulse 1.7s ease-in-out infinite;
        pointer-events: none;
      }
      #splash .halo2 {
        inset: -34px;
        background: radial-gradient(circle, rgba(167, 139, 250, 0.28) 0%, transparent 65%);
        animation: speak-pulse 2.6s ease-in-out infinite reverse;
      }
      /* 液态球体：border-radius 持续蠕动形变 + 玻璃质感高光 + 多彩极光内部 */
      #splash .orb {
        position: absolute; inset: 0;
        border-radius: 42% 58% 55% 45% / 48% 44% 56% 52%;
        background:
          radial-gradient(circle at 30% 24%, rgba(255, 255, 255, 0.95) 0%, rgba(224, 242, 254, 0.5) 10%, transparent 26%),
          radial-gradient(circle at 68% 76%, rgba(34, 211, 238, 0.75) 0%, transparent 46%),
          radial-gradient(circle at 78% 30%, rgba(236, 72, 153, 0.5) 0%, transparent 40%),
          radial-gradient(circle at 22% 66%, rgba(167, 139, 250, 0.55) 0%, transparent 42%),
          radial-gradient(circle at 55% 52%, rgba(52, 211, 153, 0.35) 0%, transparent 36%),
          radial-gradient(circle at 52% 42%, #60a5fa 0%, #3b82f6 38%, #1d4ed8 68%, #1e3a8a 100%);
        box-shadow:
          0 0 50px rgba(59, 130, 246, 0.7),
          0 0 100px rgba(34, 211, 238, 0.42),
          0 0 64px rgba(236, 72, 153, 0.2),
          inset 0 0 36px rgba(191, 219, 254, 0.5),
          inset -12px -16px 34px rgba(2, 8, 30, 0.55);
        animation: blob-morph 7s ease-in-out infinite, blob-tilt 9s ease-in-out infinite;
        overflow: hidden;
      }
      /* 内部旋转流光：多彩虹影 + 缓慢色相流转 */
      #splash .orb::before {
        content: ""; position: absolute; inset: -32%;
        background: conic-gradient(from 0deg,
          transparent 0deg,
          rgba(34, 211, 238, 0.6) 50deg,
          rgba(236, 72, 153, 0.45) 100deg,
          transparent 150deg,
          rgba(129, 140, 248, 0.5) 220deg,
          rgba(52, 211, 153, 0.4) 265deg,
          transparent 300deg);
        animation: orb-swirl 6s linear infinite, orb-hue 11s ease-in-out infinite;
        filter: blur(7px);
      }
      /* 底部内高光：水感折射 */
      #splash .orb::after {
        content: ""; position: absolute; left: 16%; right: 16%; bottom: 8%; height: 22%;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, rgba(147, 197, 253, 0.4) 0%, transparent 72%);
        filter: blur(6px);
      }
      /* ============ 打字机文案 ============ */
      #splash .tw {
        position: relative; z-index: 2;
        display: flex; flex-direction: column; align-items: center; gap: 12px;
        min-height: 76px;
      }
      #splash .tw-main {
        font-size: 27px; font-weight: 600; letter-spacing: 8px; color: #e0f2fe;
        text-shadow: 0 0 16px rgba(34, 211, 238, 0.45);
      }
      #splash .tw-main::after {
        content: "▌"; margin-left: 2px; color: #22d3ee;
        animation: caret-blink 0.85s step-end infinite;
      }
      #splash .tw-main.done::after { content: ""; }
      #splash .tw-sub {
        font-size: 12.5px; letter-spacing: 3px; color: #9ca3af;
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        min-height: 18px;
      }
      /* 加载条 */
      #splash .bar {
        position: relative; z-index: 2;
        width: 210px; height: 3px; border-radius: 3px;
        background: rgba(255, 255, 255, 0.08); overflow: hidden;
      }
      #splash .bar i {
        position: absolute; left: 0; top: 0; bottom: 0; width: 46%; border-radius: 3px;
        background: linear-gradient(90deg, #2563eb, #22d3ee);
        animation: bar-slide 1.3s ease-in-out infinite;
      }
      #splash .bar::after {
        content: ""; position: absolute; top: 0; bottom: 0; width: 40%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
        animation: bar-slide 1.3s ease-in-out infinite;
      }
      /* 交接离场：文字与加载条淡出，水球飞向主页目标位（transform 由脚本注入） */
      #splash.leaving .tw, #splash.leaving .bar, #splash.leaving .grid { opacity: 0; transition: opacity 0.45s ease; }
      #splash.leaving .orb-wrap { transition: transform 0.95s cubic-bezier(0.22, 1, 0.36, 1); }

      @keyframes blob-morph {
        0%, 100% { border-radius: 42% 58% 55% 45% / 48% 44% 56% 52%; }
        25% { border-radius: 56% 44% 42% 58% / 44% 58% 42% 56%; }
        50% { border-radius: 46% 54% 60% 40% / 56% 46% 54% 44%; }
        75% { border-radius: 52% 48% 44% 56% / 42% 54% 58% 46%; }
      }
      @keyframes blob-tilt {
        0%, 100% { transform: rotate(-3deg) translateY(0); }
        50% { transform: rotate(3deg) translateY(-7px); }
      }
      @keyframes orb-swirl { to { transform: rotate(360deg); } }
      @keyframes orb-hue {
        0%, 100% { filter: blur(7px) hue-rotate(0deg); }
        50% { filter: blur(7px) hue-rotate(70deg); }
      }
      @keyframes speak-pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.92); }
        50% { opacity: 0.9; transform: scale(1.12); }
      }
      @keyframes caret-blink { 0%, 60% { opacity: 1; } 61%, 100% { opacity: 0; } }
      @keyframes bar-slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(340%); } }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="grid"></div>
      <div class="orb-wrap">
        <div class="halo"></div>
        <div class="halo2"></div>
        <div class="orb"></div>
      </div>
      <div class="tw">
        <div class="tw-main" id="tw-main"></div>
        <div class="tw-sub" id="tw-sub"></div>
      </div>
      <div class="bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      /* 启动动画脚本（原生 JS，先于 React 就绪）：
         主页路由 → 打字机自我介绍，等 React 挂载完成（baize:app-ready）后水球飞入右侧面板交接；
         子窗口路由（#/browser 等）→ 跳过开场白，就绪后快速淡出。 */
      (function () {
        var splash = document.getElementById("splash");
        if (!splash) return;
        var hash = location.hash || "";

        /* 子窗口：无大水球交接目标，直接等就绪后淡出 */
        if (hash.indexOf("#/") === 0) {
          var doneChild = function () {
            splash.style.transition = "opacity .25s ease";
            splash.style.opacity = "0";
            setTimeout(function () { splash.remove(); }, 280);
          };
          if (window.__BAIZE_READY) doneChild();
          else window.addEventListener("baize:app-ready", doneChild, { once: true });
          setTimeout(doneChild, 8000);
          return;
        }

        var main = document.getElementById("tw-main");
        var sub = document.getElementById("tw-sub");
        var mainText = "你好，我是白泽";
        var subText = "你的本地智能体 · 会思考 / 能动手 / 记得住";

        var i = 0;
        function typeMain() {
          if (i <= mainText.length) {
            main.textContent = mainText.slice(0, i);
            i++;
            setTimeout(typeMain, 135);
          } else {
            main.classList.add("done");
            typeSub(0);
          }
        }
        function typeSub(n) {
          if (n <= subText.length) {
            sub.textContent = subText.slice(0, n);
            n++;
            setTimeout(function () { typeSub(n); }, 32);
          } else {
            readyToLeave();
          }
        }

        var leaving = false;
        function leave() {
          if (leaving) return;
          leaving = true;
          /* 目标位：主页 .mind-canvas 容器（蠕动记忆水球所在框），落位后交接给 Three.js 水球；
             取不到时依次回退右面板中心 / 屏幕右侧 */
          var wrap = splash.querySelector(".orb-wrap");
          var tx = window.innerWidth * 0.5 - 100;
          var ty = 0;
          var sc = 0.58;
          var target = document.querySelector(".mind-canvas") || document.querySelector(".right-panel");
          if (target && wrap) {
            var r = target.getBoundingClientRect();
            var w = wrap.getBoundingClientRect();
            tx = r.left + r.width / 2 - (w.left + w.width / 2);
            ty = r.top + r.height / 2 - (w.top + w.height / 2);
            /* 缩放匹配 Three.js 水球视径（fov50 / 距离210 / 半径52 → 直径≈0.53×容器高） */
            sc = Math.min(1.1, Math.max(0.5, (0.53 * r.height) / 200));
          }
          splash.classList.add("leaving");
          if (wrap) wrap.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + sc + ")";
          /* 飞行落位瞬间：通知主页 Three.js 水球淡入，交叉完成交接 */
          setTimeout(function () {
            window.dispatchEvent(new CustomEvent("baize:blob-handoff"));
            splash.style.transition = "opacity .45s ease";
            splash.style.opacity = "0";
            setTimeout(function () { splash.remove(); }, 480);
          }, 960);
        }
        function readyToLeave() {
          var go = function () { setTimeout(leave, 380); };
          if (window.__BAIZE_READY) go();
          else window.addEventListener("baize:app-ready", go, { once: true });
          setTimeout(go, 12000); /* 兜底：前端迟迟未就绪也照常离场 */
        }

        setTimeout(typeMain, 420);
      })();
    </script>
  </body>
</html>
